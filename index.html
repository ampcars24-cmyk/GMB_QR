<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cars24 Reviews</title>
  <meta name="description" content="Find the nearest Cars24 location and leave a genuine Google review.">
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fa; color: #17202a; }
    main { max-width: 560px; margin: 0 auto; padding: 28px 18px 48px; }
    .card { background: #fff; border: 1px solid #e1e7ee; border-radius: 16px; padding: 24px; box-shadow: 0 8px 28px rgba(17, 35, 54, .08); }
    .brand { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: #1c65d1; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: 28px; line-height: 1.15; }
    p { line-height: 1.5; color: #52606d; }
    label { display: block; margin: 18px 0 7px; font-weight: 700; font-size: 14px; }
    input, select, button { width: 100%; min-height: 46px; border-radius: 9px; font: inherit; }
    input, select { border: 1px solid #cbd5df; padding: 10px 12px; background: #fff; }
    button { border: 0; padding: 11px 14px; cursor: pointer; font-weight: 700; }
    button.primary { background: #1c65d1; color: #fff; }
    button.secondary { margin-top: 10px; background: #eaf1fb; color: #1555ae; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    .status { margin: 16px 0 0; min-height: 24px; color: #52606d; font-size: 14px; }
    .location { margin-top: 20px; padding: 16px; border: 1px solid #b8d1f4; border-radius: 12px; background: #f4f8ff; }
    .location h2 { margin: 0 0 6px; font-size: 18px; }
    .location p { margin: 5px 0 14px; }
    .small { font-size: 12px; color: #687786; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="title">
      <div class="brand">Cars24</div>
      <h1>Leave a review for your Cars24 location</h1>
      <p>We will help you find the nearest location. Please choose the branch you visited before opening Google’s review form.</p>

      <button id="locate" class="primary" type="button">Use my location</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>

      <label for="search">Or search for your branch</label>
      <input id="search" type="search" placeholder="Search city, area, or branch name" autocomplete="off">
      <label for="branch">Select a location</label>
      <select id="branch" aria-label="Cars24 location"></select>

      <div id="selected" class="location hidden">
        <h2 id="selected-name"></h2>
        <p id="selected-address"></p>
        <button id="review" class="primary" type="button">Open Google review form</button>
        <p class="small">Please share an honest review based on your genuine experience at this location.</p>
      </div>
    </section>
  </main>
  <script src="branches.js"></script>
  <script>
    const locations = (window.CARS24_LOCATIONS || []).filter((x) => x.reviewUrl && Number.isFinite(x.lat) && Number.isFinite(x.lng));
    const branchSelect = document.querySelector('#branch');
    const search = document.querySelector('#search');
    const status = document.querySelector('#status');
    const selected = document.querySelector('#selected');
    let visibleLocations = locations;
    let active = null;

    function label(x) { return `${x.name} — ${x.city || x.state}`; }
    function renderOptions(items) {
      visibleLocations = items;
      branchSelect.innerHTML = '<option value="">Choose a location</option>' + items.map((x, i) => `<option value="${i}">${label(x)}</option>`).join('');
      branchSelect.disabled = items.length === 0;
    }
    function showLocation(x) {
      active = x;
      selected.classList.remove('hidden');
      document.querySelector('#selected-name').textContent = x.name;
      document.querySelector('#selected-address').textContent = x.address || `${x.city || ''}, ${x.state || ''}`;
    }
    function distanceKm(aLat, aLng, bLat, bLng) {
      const rad = Math.PI / 180;
      const dLat = (bLat - aLat) * rad;
      const dLng = (bLng - aLng) * rad;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(aLat * rad) * Math.cos(bLat * rad) * Math.sin(dLng / 2) ** 2;
      return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }
    function nearest(lat, lng) {
      return locations.reduce((best, x) => !best || distanceKm(lat, lng, x.lat, x.lng) < best.distance
        ? { item: x, distance: distanceKm(lat, lng, x.lat, x.lng) } : best, null);
    }

    renderOptions(locations.slice().sort((a, b) => label(a).localeCompare(label(b))));
    search.addEventListener('input', () => {
      const q = search.value.trim().toLowerCase();
      renderOptions(locations.filter((x) => `${x.name} ${x.address} ${x.city} ${x.state}`.toLowerCase().includes(q)).slice(0, 200));
    });
    branchSelect.addEventListener('change', () => {
      const index = Number(branchSelect.value);
      if (branchSelect.value !== '') showLocation(visibleLocations[index]);
    });
    document.querySelector('#locate').addEventListener('click', () => {
      if (!navigator.geolocation) { status.textContent = 'Location is unavailable. Please search for your branch instead.'; return; }
      status.textContent = 'Finding the nearest Cars24 location…';
      navigator.geolocation.getCurrentPosition((pos) => {
        const result = nearest(pos.coords.latitude, pos.coords.longitude);
        if (!result) { status.textContent = 'No review-enabled locations were found. Please search for your branch.'; return; }
        showLocation(result.item);
        status.textContent = `Nearest location found, approximately ${result.distance.toFixed(1)} km away. Please confirm it is the branch you visited.`;
      }, () => { status.textContent = 'Location permission was not granted. Please search for your branch instead.'; }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 300000 });
    });
    document.querySelector('#review').addEventListener('click', () => { if (active) window.location.href = active.reviewUrl; });
  </script>
</body>
</html>
