<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cars24 Review QR</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #17202a; background: #f5f7fa; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(92vw, 520px); text-align: center; }
    .card { background: #fff; border: 1px solid #e1e7ee; border-radius: 18px; padding: 28px 22px 30px; box-shadow: 0 10px 30px rgba(17, 35, 54, .10); }
    .brand { color: #1c65d1; font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: 28px; }
    p { color: #52606d; line-height: 1.5; }
    .qr { display: block; width: min(78vw, 360px); height: min(78vw, 360px); margin: 22px auto; border: 10px solid #fff; border-radius: 12px; box-shadow: 0 4px 18px rgba(17, 35, 54, .12); image-rendering: pixelated; }
    .target { font-size: 12px; overflow-wrap: anywhere; color: #687786; }
    a { color: #1555ae; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <div class="brand">Cars24</div>
      <h1>Scan to leave a review</h1>
      <p>Open your phone camera and scan this QR code. You will be taken to the Cars24 review flow to choose the correct location.</p>
      <img class="qr" alt="Cars24 review QR code" src="https://api.qrserver.com/v1/create-qr-code/?size=720x720&amp;margin=18&amp;data=https%3A%2F%2Fampcars24-cmyk.github.io%2FGMB_QR%2Freview-router%2F">
      <p class="target">QR destination: <a href="https://ampcars24-cmyk.github.io/GMB_QR/review-router/">Cars24 review flow</a></p>
    </section>
  </main>
</body>
</html>
